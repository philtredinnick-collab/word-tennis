ewhere quiet first: \" + this.secs + \" seconds each, \" + this.target + \" points a game.\",\n      invitedCta: s.winner !== null ? \"See the result\" : \"Show me the words\",\n      needsName: /^Player [12]$/.test(s.names[me]),\n      acceptTurn: () => {\n        const names = s.names.slice();\n        if (s.nameDraft) names[me] = s.nameDraft;\n        this.setState({ names: names, screen: s.winner !== null ? \"win\" : \"steal\", guessDraft: \"\" });\n      },\n\n      framingRef: (el) => { this.framingEl = el; this.attachVideo(); },\n      roundRef: (el) => { this.roundEl = el; this.attachVideo(); },\n      cameraNote: s.cameraNote,\n      confirmFraming: () => { this.dealOptions(); this.setState({ screen: \"subject\" }); },\n\n      optionA: s.options[0] ? s.options[0].name : \"\",\n      optionB: s.options[1] ? s.options[1].name : \"\",\n      chooseA: () => this.countIn(0),\n      chooseB: () => this.countIn(1),\n      countNumber: s.countNumber,\n\n      secondsLeft: s.secondsLeft,\n      timerBarStyle: { height: \"100%\", background: \"#bed696\", borderRadius: \"999px\", width: (100 * s.secondsLeft / this.secs) + \"%\", transition: \"width .2s linear\" },\n      subjectName: s.subject ? s.subject.name : \"\",\n      foundCount: s.tiles.filter(function (t) { return t.found; }).length,\n      listenNote: s.listenNote,\n      tiles: (on(\"results\") ? (pending.tiles || []) : s.tiles).map((t, i) => ({\n        word: t.word, found: t.found, missed: !t.found,\n        hidden: !t.found,\n        mask: \"•\".repeat(Math.min(7, t.word.length)),\n        reveal: () => {\n          return;\n          this.setState(function (st) {\n            const next = st.tiles.slice();\n            next[i] = Object.assign({}, next[i], { found: true });\n            return { tiles: next };\n          });\n        }\n      })),\n\n      resultHeadline: (pending.points || 0) + \" of 9\",\n      resultSub: (pending.points || 0) >= 7 ? \"Barely a crumb left for them.\" : (pending.points || 0) >= 4 ? \"Decent. Not safe.\" : \"That's a lot of rope you've handed over.\",\n      pendingPoints: pending.points || 0,\n      pendingPointsLabel: this.pts(pending.points || 0),\n      opponentName: s.names[other],\n      shareHint: s.shareHint,\n      sendBlocked: s.clipSending,\n      sendPrimaryLabel: s.clipSending ? \"Sealing your clip…\" : \"Send turn + clip to \" + s.names[other],\n      sendBtnStyle: {\n        border: 0, cursor: s.clipSending ? \"wait\" : \"pointer\",\n        background: s.clipSending ? \"rgba(190,214,150,.45)\" : \"#bed696\",\n        color: \"#0e3a24\", borderRadius: \"999px\", padding: \"16px\", fontSize: \"15px\",\n        fontWeight: 700, letterSpacing: \".06em\", textTransform: \"uppercase\"\n      },\n      sendToOpponent: async () => {\n        /* never build the payload before the clip has an id, or the turn ships\n           with no clip and the opponent gets nothing */\n        if (this.upload) { try { await this.upload; } catch (e) {} }\n        await this.share(this.turnMessage(\"Your turn at Word Tennis — \" + this.pts(pending.points || 0) + \" to steal.\"), \"\");\n        this.setState({ screen: \"handoff\" });\n      },\n      copyLink: async () => {\n        if (this.upload) { try { await this.upload; } catch (e) {} }\n        try { await navigator.clipboard.writeText(this.turnMessage(\"Your turn at Word Tennis.\")); this.setState({ copied: true }); } catch (e) {}\n      },\n      copyLabel: s.copied ? \"Copied — paste it to them\" : \"Copy the turn instead\",\n      sendAgainLabel: s.sent ? \"Send it again\" : \"Send turn + clip\",\n\n      handoffTitle: \"Over to \" + s.names[other],\n      handoffBody: s.names[other] + \" gets the words you missed and your clip — but the clip stays sealed until they've locked a guess, and then they get one watch. Nothing to save, nothing to peek at.\",\n      clipSending: s.clipSending,\n      clipReady: !s.clipSending && !!s.clipId,\n      clipBad: !s.clipSending && !s.clipId,\n      clipStatusText: s.clipSending\n        ? \"Sealing your clip…\"\n        : s.clipId\n          ? \"Your clip is sealed and travelling with this turn.\"\n          : s.clipErr === \"no-host\"\n            ? \"No host: this copy can't move your clip. Deploy the server folder, or open the game from the host's own address.\"\n            : s.clipErr\n              ? \"Your clip couldn't reach the host — only the words will travel. Check the host is awake and try the next turn.\"\n              : \"No clip was recorded for this turn.\",\n      canSend: !s.clipSending,\n      hostDraft: s.hostDraft,\n      setHost: (e) => this.setState({ hostDraft: e.target.value }),\n      saveHost: () => {\n        const v = String(s.hostDraft || \"\").trim().replace(/\\/+$/, \"\");\n        try { v ? localStorage.setItem(\"wt_relay\", v) : localStorage.removeItem(\"wt_relay\"); } catch (e) {}\n        this.setState({ relay: v });\n      },\n      hostLabel: this.relayBase() || \"none — clips can't travel\",\n      switchLabel: \"Demo: play both sides on this phone\",\n      switchSeat: () => this.setState({\n        seat: other, screen: \"steal\", guessDraft: \"\",\n        /* the demo goes through the relay when there is one, so this path tests\n           the real thing; the local blob is only a fallback */\n        pending: Object.assign({}, pending, {\n          clipId: s.clipId || null,\n          clip: s.clipId ? null : (pending.clip || s.clipUrl)\n        })\n      }),\n\n      stealHeadline: s.names[other] + \" got \" + (pending.points || 0) + \" of 9\",\n      missedWords: missed.map(function (t) { return { word: t.word }; }),\n      submitGuess: async () => {\n        const sibling = this.pairs[pending.pairIdx][1 - pending.side];\n        const right = this.guessCorrect(s.guessDraft, pending.subject, sibling.name);\n        const winnerSeat = right ? me : pending.by;\n        const r = this.award(winnerSeat, pending.points || 0);\n        const entry = {\n          title: s.names[pending.by] + \" played “\" + pending.subject + \"” — \" + (pending.points || 0) + \" of 9\",\n          detail: (right\n            ? s.names[me] + \" guessed it and stole \" + (pending.points || 0)\n            : s.names[me] + \" said “\" + (s.guessDraft || \"nothing\") + \"” — points stay with \" + s.names[pending.by])\n            + (r.milestone ? \" · \" + r.milestone.toUpperCase() + \" \" + s.names[winnerSeat] : \"\")\n        };\n        this.setState({\n          points: r.points, games: r.games, sets: r.sets, setLog: r.setLog,\n          history: [entry].concat(s.history), winner: r.winner,\n          lastRound: {\n            right: right, subject: pending.subject, points: pending.points || 0, clip: pending.clip,\n            guess: s.guessDraft, tiles: pending.tiles || [],\n            owner: s.names[pending.by], milestone: r.milestone, milestoneWho: s.names[winnerSeat]\n          },\n          pendingResult: {\n            points: r.points, games: r.games, sets: r.sets, setLog: r.setLog, winner: r.winner, entry: entry\n          },\n          screen: \"tease\", pending: null, clipTime: 0, watched: 0, needsTap: false,\n          clipId: pending.clipId || null\n        });\n        /* the guess is what buys the video — fetch it only now */\n        if (!pending.clip && pending.clipId) {\n          const url = await this.unlockClip(pending.clipId, s.guessDraft);\n          if (url) this.setState((st) => ({ lastRound: Object.assign({}, st.lastRound, { clip: url }) }));\n        }\n      },\n\n      teaseGuess: last.guess ? \"“\" + last.guess + \"”\" : \"No guess at all\",\n      ownerName: last.owner || s.names[other],\n      startPlayback: () => this.setState({ screen: \"playback\", clipTime: 0, needsTap: false }),\n      clipRef: (el) => {\n        if (!el || el === this.clipEl) return;\n        this.clipEl = el;\n        if (last.clip) el.src = last.clip;\n        const p = el.play();\n        if (p && p.catch) p.catch(() => this.setState({ needsTap: true }));\n      },\n      needsTap: s.needsTap,\n      manualPlay: () => { this.setState({ needsTap: false }); if (this.clipEl) { const p = this.clipEl.play(); if (p && p.catch) p.catch(function () {}); } },\n      onClipTime: (e) => this.setState({ clipTime: e.target.currentTime, clipDur: e.target.duration }),\n      onClipEnd: () => { this.clipEl = null; this.setState({ watched: s.watched + 1 }); this.applyVerdict(); },\n      clipBarStyle: { height: \"100%\", background: \"#bed696\", borderRadius: \"999px\", width: Math.min(100, 100 * (s.clipTime / this.secs)) + \"%\" },\n      litCount: (last.tiles || []).filter(function (t) { return t.found && (t.at || 0) <= s.clipTime; }).length,\n      playTiles: (last.tiles || []).map((t) => ({\n        word: t.word,\n        lit: !!t.found && (t.at || 0) <= s.clipTime,\n        waiting: !!t.found && (t.at || 0) > s.clipTime,\n        known: !t.found,\n        said: !!t.found,\n        mask: \"•\".repeat(Math.min(7, t.word.length))\n      })),\n\n      verdictKicker: last.right ? \"You called it\" : \"The subject was\",\n      revealHeadline: last.right ? \"Stolen\" : \"Not it\",\n      revealSub: last.right\n        ? \"It was “\" + last.subject + \"”. \" + this.pts(last.points || 0) + \" to you.\"\n        : \"It was “\" + last.subject + \"”. \" + this.pts(last.points || 0) + (last.points === 1 ? \" stays\" : \" stay\") + \" with \" + last.owner + \".\",\n      hasClip: !!last.clip, noClip: !last.clip && !s.fetching, fetching: s.fetching,\n      clipHelp: this.relayBase()\n        ? \"Their clip didn't reach the host — it may have already been watched, or the host was asleep when they recorded. You can load their video by hand instead; your guess is already locked, so nothing's spoiled.\"\n        : \"This copy of the game has no host to move clips through, so only the words travelled. Deploy the host in the server folder — then clips arrive on their own.\",\n      pickClip: (e) => {\n        const f = e.target.files && e.target.files[0];\n        if (f) this.setState({ lastRound: Object.assign({}, s.lastRound, { clip: URL.createObjectURL(f) }) });\n      },\n      canReplay: !!last.clip,\n      replayLabel: \"Watch it once more\",\n      replayClip: () => { this.clipEl = null; this.setState({ screen: \"playback\", clipTime: 0, needsTap: false }); },\n      clipGoneNote: last.clip ? \"Move on and the clip is gone for good.\" : \"The clip is gone.\",\n      afterRevealLabel: last.milestone ? last.milestone + \" to \" + last.milestoneWho : \"My serve\",\n      afterReveal: () => {\n        this.dropClip();\n        if (last.milestone) { this.setState({ screen: \"milestone\" }); return; }\n        this.openCamera();\n        this.setState({ screen: \"framing\" });\n      },\n\n      milestoneWord: last.milestone || \"\",\n      milestoneWho: last.milestoneWho ? last.milestoneWho : \"\",\n      milestoneLine: last.milestone === \"Match\"\n        ? \"Two sets to \" + s.sets[1 - (s.winner || 0)] + \". That's the match.\"\n        : last.milestone === \"Set\"\n          ? \"Set to \" + last.milestoneWho + \". Sets now \" + s.sets[0] + \"–\" + s.sets[1] + \".\"\n          : \"Games in this set: \" + s.games[0] + \"–\" + s.games[1] + \". Six takes the set.\",\n      afterMilestoneLabel: s.winner !== null ? \"See the result\" : \"Play on\",\n      afterMilestone: () => {\n        if (s.winner !== null) { this.setState({ screen: \"win\" }); return; }\n        this.openCamera();\n        this.setState({ screen: \"framing\" });\n      },\n\n      winnerName: s.winner !== null ? s.names[s.winner] : \"\",\n      finalLine: s.winner !== null ? \"Sets \" + s.sets[0] + \"–\" + s.sets[1] + \".\" : \"\",\n      finalSets: s.setLog.length ? \"Games: \" + s.setLog.map(function (g) { return g[0] + \"–\" + g[1]; }).join(\", \") : \"\",\n      sendResult: () => this.share(this.turnMessage(\"Word Tennis: \" + (s.winner !== null ? s.names[s.winner] : \"\") + \" takes the match \" + s.sets[0] + \"–\" + s.sets[1] + \".\"), \"\"),\n      rematch: () => {\n        this.openCamera();\n        this.setState({ points: [0, 0], games: [0, 0], sets: [0, 0], setLog: [], history: [], winner: null, pending: null, screen: \"framing\", copied: false, sent: false });\n      },\n\n      history: s.history,\n      emptyHistory: s.history.length === 0,\n      openHistory: () => this.setState({ prevScreen: s.screen, screen: \"history\" }),\n      closeHistory: () => this.setState({ screen: s.prevScreen || \"home\" })\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
