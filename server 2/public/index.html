  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

 of any role matches the others in visual value. */\n  --color-neutral-100: #f9f4ed;\n  --color-neutral-200: #eee7db;\n  --color-neutral-300: #dcd3c4;\n  --color-neutral-400: #c0b6a5;\n  --color-neutral-500: #a19786;\n  --color-neutral-600: #82796a;\n  --color-neutral-700: #645c50;\n  --color-neutral-800: #474238;\n  --color-neutral-900: #2e2b25;\n\n  --color-accent-100: #fff2eb;\n  --color-accent-200: #ffe1d0;\n  --color-accent-300: #ffc6a5;\n  --color-accent-400: #f6a06b;\n  --color-accent-500: #d67f48;\n  --color-accent-600: #b2622d;\n  --color-accent-700: #8c491a;\n  --color-accent-800: #643312;\n  --color-accent-900: #402310;\n\n  --color-accent-2-100: #f0fae1;\n  --color-accent-2-200: #e1eecc;\n  --color-accent-2-300: #ccdbb2;\n  --color-accent-2-400: #aebf92;\n  --color-accent-2-500: #8fa073;\n  --color-accent-2-600: #728157;\n  --color-accent-2-700: #56633f;\n  --color-accent-2-800: #3d472b;\n  --color-accent-2-900: #272e1b;\n\n  --font-heading: \"Caprasimo\", system-ui, sans-serif;\n  --font-heading-weight: 400;\n  --font-body: \"Figtree\", system-ui, sans-serif;\n\n  --space-1: 4.4px;\n  --space-2: 8.8px;\n  --space-3: 13.2px;\n  --space-4: 17.6px;\n  --space-6: 26.4px;\n  --space-8: 35.2px;\n\n  --radius-sm: 8px;\n  --radius-md: 16px;\n  --radius-lg: 28px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2e2b25 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2e2b25 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2e2b25 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.washed{filter:saturate(0.6) contrast(0.85) brightness(1.1) opacity(0.94)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — rounded frame: everything softens, small controls go pill — */\n.card, .dialog { border-radius: calc(var(--radius-lg) * 1.15); }\n.btn, .tag, .seg, .input { border-radius: 999px; }\n.input { padding-inline: 14px; }\n\n<\u002Fstyle>\n<script src=\"b5888358-687a-4158-a906-90e4eccd92e3\"><\u002Fscript>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin=\"\">\n<style>/* latin-ext */\n@font-face {\n  font-family: 'Figtree';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"b362c3c6-0720-4fa6-b414-eb95b0841b2f\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Figtree';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"464e441c-0f05-43d2-ac83-b3fd6bdec155\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Figtree';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"b362c3c6-0720-4fa6-b414-eb95b0841b2f\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Figtree';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"464e441c-0f05-43d2-ac83-b3fd6bdec155\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {  U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  body { margin: 0; background: #0a2b1b; }\n  a { color: #0e3a24; }\n  a:hover { color: #16543a; }\n  input, button { font-family: \"Figtree\", system-ui, sans-serif; }\n  ::selection { background: rgba(190,214,150,.5); }\n  :focus-visible { outline: 2px solid #bed696; outline-offset: 2px; }\n  @keyframes wt-pulse { 0%,100% { opacity: .3 } 50% { opacity: .85 } }\n  @keyframes wt-pop { from { transform: scale(.8); opacity: 0 } to { transform: scale(1); opacity: 1 } }\n  @keyframes wt-spin { to { transform: rotate(360deg) } }\n  @media (max-width: 560px) {\n    [data-wt-page] { padding: 0 !important; min-height: 100dvh !important; }\n    [data-wt-shell] { width: 100vw !important; height: 100dvh !important; border-radius: 0 !important; box-shadow: none !important; }\n  }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div data-wt-page=\"1\" style=\"min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px;background:#0a2b1b;font-family:'Figtree',system-ui,sans-serif\">\n<div data-wt-shell=\"1\" style=\"width:390px;height:844px;position:relative;background:#0e3a24;border-radius:44px;box-shadow:0 24px 60px rgba(0,0,0,.45);overflow:hidden;display:flex;flex-direction:column;color:#f4f7ee\">\n\n  <div style=\"height:32px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:rgba(244,247,238,.5)\">{{ seatLabel }}<\u002Fdiv>\n\n  <sc-if value=\"{{ showScorebar }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"flex:0 0 auto;margin:0 16px 14px;background:#f4f7ee;border-radius:14px;overflow:hidden;color:#0e3a24\">\n      <div style=\"display:flex;align-items:center;justify-content:space-between;padding:6px 12px;background:#0e3a24;color:#f4f7ee;font-size:9px;letter-spacing:.2em;text-transform:uppercase\">\n        <span>{{ scoreCaption }}<\u002Fspan>\n        <span sc-camel-on-click=\"{{ openHistory }}\" style=\"cursor:pointer;letter-spacing:.2em;color:#bed696\">Log<\u002Fspan>\n      <\u002Fdiv>\n      <sc-for list=\"{{ sbRows }}\" as=\"r\" hint-placeholder-count=\"2\">\n        <div style=\"display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid rgba(14,58,36,.12)\">\n          <sc-if value=\"{{ r.isMe }}\" hint-placeholder-val=\"{{ true }}\">\n            <span style=\"width:8px;height:8px;border-radius:999px;background:#0e3a24\"><\u002Fspan>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ r.notMe }}\" hint-placeholder-val=\"{{ false }}\">\n            <span style=\"width:8px;height:8px;border-radius:999px;border:1px solid rgba(14,58,36,.4)\"><\u002Fspan>\n          <\u002Fsc-if>\n          <span style=\"flex:1;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:uppercase;letter-spacing:.04em\">{{ r.name }}<\u002Fspan>\n          <sc-for list=\"{{ r.sets }}\" as=\"c\" hint-placeholder-count=\"1\">\n            <span style=\"width:20px;text-align:center;font-size:14px;color:rgba(14,58,36,.5);font-variant-numeric:tabular-nums\">{{ c.v }}<\u002Fspan>\n          <\u002Fsc-for>\n          <span style=\"width:24px;text-align:center;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums\">{{ r.games }}<\u002Fspan>\n          <span style=\"min-width:34px;text-align:right;font-family:'Libre Baskerville',Georgia,serif;font-size:17px;font-variant-numeric:tabular-nums\">{{ r.points }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"flex:1;min-height:0;position:relative\">\n\n    <sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"position:absolute;inset:0;display:flex;flex-direction:column;padding:26px 26px 34px;overflow:auto\">\n        <div style=\"position:absolute;right:-46px;top:-10px;width:150px;height:150px;border-radius:999px;border:2px solid rgba(190,214,150,.35)\"><\u002Fdiv>\n        <div style=\"position:relative;margin-top:auto\">\n          <div style=\"font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:#bed696;margin-bottom:10px\">Est. right now<\u002Fdiv>\n          <h1 style=\"font-family:'Libre Baskerville',Georgia,serif;font-size:50px;line-height:1;margin:0 0 16px;color:#f4f7ee\">Word<br><em style=\"color:#bed696\">Tennis<\u002Fem><\u002Fh1>\n          <p style=\"max-width:262px;color:rgba(244,247,238,.75);font-size:15px;line-height:1.5;margin:0 0 26px\">Thirty seconds, nine hidden words, one subject. Say them out loud — or leave them for your opponent to steal. Games, sets and match.<\u002Fp>\n          <div style=\"display:flex;flex-direction:column;gap:10px\">\n            <label style=\"display:flex;flex-direction:column;gap:6px\">\n              <span style=\"font-size:10px;text-transform:uppercase;letter-spacing:.18em;color:rgba(244,247,238,.6)\">Your name<\u002Fspan>\n              <input value=\"{{ nameDraft }}\" sc-camel-on-change=\"{{ setNameDraft }}\" style=\"border:1px solid rgba(244,247,238,.3);background:rgba(244,247,238,.08);color:#f4f7ee;border-radius:999px;padding:13px 20px;font-size:15px\">\n            <\u002Flabel>\n            <button sc-camel-on-click=\"{{ startMatch }}\" style=\"border:0;cursor:pointer;background:#bed696;color:#0e3a24;border-radius:999px;padding:16px;font-size:15px;font-weight:700;letter-spacing:.06em;text-transform:uppercase\" style-hover=\"background:#d3e4b4\">Start a match<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ goJoin }}\" style=\"cursor:pointer;background:transparent;color:#f4f7ee;border:1px solid rgba(244,247,238,.4);border-radius:999px;padding:15px;font-size:14px;letter-spacing:.06em;text-transform:uppercase\" style-hover=\"background:rgba(244,247,238,.1)\">Paste a turn<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ toggleSettings }}\" style=\"cursor:pointer;background:transparent;color:#bed696;border:0;padding:10px;font-size:13px;letter-spacing:.06em\">{{ settingsLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n          <sc-if value=\"{{ settingsOpen }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background:rgba(244,247,238,.08);border:1px solid rgba(244,247,238,.16);border-radius:20px;padding:18px;margin-top:6px;display:flex;flex-direction:column;gap:18px\">\n              <div>\n                <div style=\"display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px\">\n                  <span style=\"font-size:10px;text-transform:uppercase;letter-spacing:.18em;color:rgba(244,247,238,.6)\">Talking time<\u002Fspan>\n                  <span style=\"font-family:'Libre Baskerville',Georgia,serif;font-size:17px\">{{ secsLabel }}<\u002Fspan>\n                <\u002Fdiv>\n                <input type=\"range\" min=\"20\" max=\"60\" step=\"5\" value=\"{{ secsSetting }}\" sc-camel-on-change=\"{{ setSecs }}\" style=\"width:100%;accent-color:#bed696\">\n              <\u002Fdiv>\n              <div>\n                <div style=\"display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px\">\n                  <span style=\"font-size:10px;text-transform:uppercase;letter-spacing:.18em;color:rgba(244,247,238,.6)\">Points to win a game<\u002Fspan>\n                  <span style=\"font-family:'Libre Baskerville',Georgia,serif;font-size:17px\">{{ targetLabel }}<\u002Fspan>\n                <\u002Fdiv>\n                <input type=\"range\" min=\"11\" max=\"50\" step=\"1\" value=\"{{ targetSetting }}\" sc-camel-on-change=\"{{ setTarget }}\" style=\"width:100%;accent-color:#bed696\">\n              <\u002Fdiv>\n              <p style=\"font-size:12px;color:rgba(244,247,238,.6);margin:0\">Six games take the set, two sets take the match. Whoever starts sets the rules; they travel with every turn.<\u002Fp>\n              <div style=\"border-top:1px solid rgba(244,247,238,.14);padding-top:16px\">\n                <div style=\"font-size:10px;text-transform:uppercase;letter-spacing:.18em;color:rgba(244,247,238,.6);margin-bottom:8px\">Clip host<\u002Fdiv>\n                <input type=\"text\" value=\"{{ hostDraft }}\" sc-camel-on-change=\"{{ setHost }}\" sc-camel-on-blur=\"{{ saveHost }}\" placeholder=\"https://your-host.onrender.com\" style=\"width:100%;box-sizing:border-box;background:rgba(7,30,19,.5);border:1px solid rgba(244,247,238,.2);border-radius:999px;padding:12px 16px;color:#f4f7ee;font-size:13px;font-family:inherit\">\n                <p style=\"font-size:11px;color:rgba(244,247,238,.55);margin:8px 0 0;line-height:1.5\">Where clips are sealed in transit. Leave empty when you open the game from the host's own address. Currently: {{ hostLabel }}<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <p style=\"font-size:12px;color:rgba(244,247,238,.55);margin-top:18px\">{{ supportNote }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isJoin }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:26px;gap:16px;overflow:auto\">\n        <h2 style=\"font-family:'Libre Baskerville',Georgia,serif;font-size:32px;margin:0\">Paste a turn<\u002Fh2>\n        <p style=\"color:rgba(244,247,238,.75);margin:0;font-size:14px\">Copy the whole message your opponent sent — or just the line starting <span style=\"font-family:ui-monospace,Menlo,monospace\">t=<\u002Fspan> — and paste it here.<\u002Fp>\n        <textarea value=\"{{ codeDraft }}\" sc-camel-on-change=\"{{ setCodeDraft }}\" rows=\"4\" placeholder=\"Paste the message or t=… code\" style=\"border:1px solid rgba(244,247,238,.3);background:rgba(244,247,238,.08);color:#f4f7ee;border-radius:20px;padding:14px 18px;font-size:14px;font-family:inherit;resize:none\"><\u002Ftextarea>\n        <button sc-camel-on-click=\"{{ joinMatch }}\" style=\"border:0;cursor:pointer;background:#bed696;color:#0e3a24;border-radius:999px;padding:16px;font-size:15px;font-weight:700;letter-spacing:.06em;text-transform:uppercase\">Open my turn<\u002Fbutton>\n        <p style=\"font-size:12px;color:#f0b8a0;margin:0\">{{ joinError }}<\u002Fp>\n        <button sc-camel-on-click=\"{{ goHome }}\" style=\"cursor:pointer;background:transparent;color:rgba(244,247,238,.7);border:0;padding:10px;font-size:13px\">Back<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isInvited }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:26px;gap:16px;overflow:auto\">\n        <div style=\"position:absolute;left:-50px;bottom:60px;width:140px;height:140px;border-radius:999px;border:2px solid rgba(190,214,150,.3)\"><\u002Fdiv>\n        <div style=\"position:relative;display:flex;flex-direction:column;gap:16px\">\n          <div style=\"font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:#bed696\">Match {{ matchCode }}<\u002Fdiv>\n          <h2 style=\"font-family:'Libre Baskerville',Georgia,serif;font-size:32px;margin:0;line-height:1.1\">{{ invitedTitle }}<\u002Fh2>\n          <p style=\"color:rgba(244,247,238,.78);margin:0;font-size:14px;line-height:1.55\">{{ invitedBody }}<\u002Fp>\n          <sc-if value=\"{{ needsName }}\" hint-placeholder-val=\"{{ false }}\">\n            <label style=\"display:flex;flex-direction:column;gap:6px\">\n              <span style=\"font-size:10px;text-transform:uppercase;letter-spacing:.18em;color:rgba(244,247,238,.6)\">Your name<\u002Fspan>\n              <input value=\"{{ nameDraft }}\" sc-camel-on-change=\"{{ setNameDraft }}\" style=\"border:1px solid rgba(244,247,238,.3);background:rgba(244,247,238,.08);color:#f4f7ee;border-radius:999px;padding:13px 20px;font-size:15px\">\n            <\u002Flabel>\n          <\u002Fsc-if>\n          <button sc-camel-on-click=\"{{ acceptTurn }}\" style=\"border:0;cursor:pointer;background:#bed696;color:#0e3a24;border-radius:999px;padding:16px;font-size:15px;font-weight:700;letter-spacing:.06em;text-transform:uppercase\">{{ invitedCta }}<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isFraming }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position:absolute;inset:0;background:#071e13\">\n        <video ref=\"{{ framingRef }}\" autoplay=\"true\" muted=\"true\" sc-camel-plays-inline=\"true\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)\"><\u002Fvideo>\n        <div style=\"position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:26px;background:linear-gradient(180deg, rgba(7,30,19,.7), rgba(7,30,19,0) 32%, rgba(7,30,19,.85))\">\n          <p style=\"color:#f4f7ee;text-align:center;max-width:250px;margin:0;font-size:14px;text-shadow:0 1px 8px rgba(0,0,0,.6)\">Hold the phone up and put your face inside the line.<\u002Fp>\n          <div style=\"width:224px;height:284px;border:2px solid rgba(190,214,150,.9);border-radius:999px\"><\u002Fdiv>\n          <div style=\"align-self:stretch;display:flex;flex-direction:column;gap:10px\">\n            <p style=\"color:#bed696;font-size:12px;text-align:center;margin:0;text-wrap:pretty\">{{ cameraNote }}<\u002Fp>\n            <sc-if value=\"{{ camReady }}\" hint-placeholder-val=\"{{ true }}\">\n              <button sc-camel-on-click=\"{{ confirmFraming }}\" style=\"border:0;cursor:pointer;background:#bed696;color:#0e3a24;border-radius:999px;padding:16px;font-size:15px;font-weight:700;letter-spacing:.06em;text-transform:uppercase\">I'm in frame<\u002Fbutton>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ camBlocked }}\" hint-placeholder-val=\"{{ false }}\">\n              <button sc-camel-on-click=\"{{ retryCamera }}\" style=\"border:0;cursor:pointer;background:#bed696;color:#0e3a24;border-radius:999px;padding:16px;font-size:15px;font-weight:700;letter-spacing:.06em;text-transform:uppercase\">Retry camera<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ goHome }}\" style=\"cursor:pointer;background:transparent;color:rgba(244,247,238,.75);border:1px solid rgba(244,247,238,.35);border-radius:999px;padding:13px;font-size:13px\">Back<\u002Fbutton>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isSubject }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position:absolute;inset:0;display:flex;flex-direction:column;padding:26px;gap:14px\">\n        <div>\n          <div style=\"font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:#bed696;margin-bottom:8px\">Two of a kind<\u002Fdiv>\n          <h2 style=\"font-family:'Libre Baskerville',Georgia,serif;font-size:30px;margin:0 0 6px\">Pick one<\u002Fh2>\n          <p style=\"color:rgba(244,247,238,.7);margin:0;font-size:14px\">Nine words hide inside whichever you take.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"flex:1;display:flex;flex-direction:column;gap:12px;justify-content:center\">\n          <button sc-camel-on-click=\"{{ chooseA }}\" style=\"border:0;cursor:pointer;text-align:left;background:#f4f7ee;color:#0e3a24;border-radius:24px;padding:26px;font-family:'Libre Baskerville',Georgia,serif;font-size:29px;line-height:1.08\" style-hover=\"background:#ffffff\">{{ optionA }}<\u002Fbutton>\n          <div style=\"text-align:center;font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:rgba(244,247,238,.5)\">or<\u002Fdiv>\n          <button sc-camel-on-click=\"{{ chooseB }}\" style=\"border:0;cursor:pointer;text-align:left;background:#bed696;color:#0e3a24;border-radius:24px;padding:26px;font-family:'Libre Baskerville',Georgia,serif;font-size:29px;line-height:1.08\" style-hover=\"background:#d3e4b4\">{{ optionB }}<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isCountIn }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position:absolute;inset:0;background:#071e13\">\n        <video ref=\"{{ roundRef }}\" autoplay=\"true\" muted=\"true\" sc-camel-plays-inline=\"true\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)\"><\u002Fvideo>\n        <div style=\"position:absolute;inset:0;background:rgba(7,30,19,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px\">\n          <div style=\"font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:#bed696\">Recording in<\u002Fdiv>\n          <div style=\"font-family:'Libre Baskerville',Georgia,serif;font-size:140px;line-height:1;color:#f4f7ee;animation:wt-pop .3s ease-out\">{{ countNumber }}<\u002Fdiv>\n          <div style=\"font-family:'Libre Baskerville',Georgia,serif;font-size:24px;color:#bed696;margin-top:8px\">{{ subjectName }}<\u002Fdiv>\n          <p style=\"color:rgba(244,247,238,.7);font-size:13px;margin:10px 0 0\">Deep breath. Keep talking.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isRound }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position:absolute;inset:0;background:#071e13\">\n        <video ref=\"{{ roundRef }}\" autoplay=\"true\" muted=\"true\" sc-camel-plays-inline=\"true\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)\"><\u002Fvideo>\n        <div style=\"position:absolute;inset:0;background:linear-gradient(180deg, rgba(7,30,19,.72), rgba(7,30,19,.05) 26%, rgba(7,30,19,.9) 58%)\"><\u002Fdiv>\n\n        <div style=\"position:absolute;top:16px;left:16px;right:16px;display:flex;align-items:center;gap:12px\">\n          <div style=\"font-family:'Libre Baskerville',Georgia,serif;font-size:38px;color:#f4f7ee;min-width:50px;font-variant-numeric:tabular-nums;text-shadow:0 2px 10px rgba(0,0,0,.6)\">{{ secondsLeft }}<\u002Fdiv>\n          <div style=\"flex:1;height:6px;border-radius:9 erif;font-size:28px;margin:8px 0 6px;line-height:1.15\">{{ stealHeadline }}<\u002Fh2>\n          <p style=\"color:rgba(244,247,238,.72);margin:0;font-size:14px;line-height:1.5\">These are the words they <em>didn't<\u002Fem> say. Name the subject and you take {{ pendingPointsLabel }}. One guess.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n          <sc-for list=\"{{ missedWords }}\" as=\"m\" hint-placeholder-count=\"5\">\n            <div style=\"background:#f4f7ee;color:#0e3a24;border-radius:999px;padding:9px 16px;font-family:'Libre Baskerville',Georgia,serif;font-size:15px\">{{ m.word }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"margin-top:auto;display:flex;flex-direction:column;gap:10px\">\n          <input value=\"{{ guessDraft }}\" sc-camel-on-change=\"{{ setGuessDraft }}\" placeholder=\"The subject was…\" style=\"border:1px solid rgba(244,247,238,.3);background:rgba(244,247,238,.08);color:#f4f7ee;border-radius:999px;padding:15px 20px;font-size:16px\">\n          <button sc-camel-on-click=\"{{ submitGuess }}\" style=\"border:0;cursor:pointer;background:#bed696;color:#0e3a24;border-radius:999px;padding:16px;font-size:15px;font-weight:700;letter-spacing:.06em;text-transform:uppercase\">Lock it in<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isTease }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:26px;gap:14px;overflow:auto\">\n        <div style=\"position:absolute;right:-40px;top:90px;width:150px;height:150px;border-radius:999px;border:2px solid rgba(190,214,150,.3);animation:wt-pulse 2.4s infinite\"><\u002Fdiv>\n        <div style=\"position:relative;display:flex;flex-direction:column;gap:14px\">\n          <div style=\"font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:#bed696\">Locked in<\u002Fdiv>\n          <h2 style=\"font-family:'Libre Baskerville',Georgia,serif;font-size:34px;margin:0;line-height:1.12\">Let's see if you're right…<\u002Fh2>\n          <div style=\"background:#f4f7ee;color:#0e3a24;border-radius:22px;padding:18px 22px\">\n            <div style=\"font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:rgba(14,58,36,.55);margin-bottom:4px\">Your guess<\u002Fdiv>\n            <div style=\"font-family:'Libre Baskerville',Georgia,serif;font-size:26px;line-height:1.15\">{{ teaseGuess }}<\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"color:rgba(244,247,238,.75);margin:0;font-size:14px;line-height:1.55\">Now watch {{ ownerName }}'s {{ secsLabel }}. Their words light up as they say them — and when the clip ends, you'll know.<\u002Fp>\n          <button sc-camel-on-click=\"{{ startPlayback }}\" style=\"border:0;cursor:pointer;background:#bed696;color:#0e3a24;border-radius:999px;padding:16px;font-size:15px;font-weight:700;letter-spacing:.06em;text-transform:uppercase\">Play their clip<\u002Fbutton>\n          <p style=\"font-size:11px;color:rgba(244,247,238,.5);margin:0;text-align:center\">One watch. It's gone after that.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isPlayback }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position:absolute;inset:0;background:#071e13\">\n        <sc-if value=\"{{ hasClip }}\" hint-placeholder-val=\"{{ true }}\">\n          <video ref=\"{{ clipRef }}\" sc-camel-plays-inline=\"true\" sc-camel-on-time-update=\"{{ onClipTime }}\" sc-camel-on-ended=\"{{ onClipEnd }}\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover\"><\u002Fvideo>\n          <div style=\"position:absolute;inset:0;background:linear-gradient(180deg, rgba(7,30,19,.6), rgba(7,30,19,.05) 24%, rgba(7,30,19,.92) 60%)\"><\u002Fdiv>\n          <div style=\"position:absolute;top:18px;left:16px;right:16px;display:flex;align-items:center;gap:10px\">\n            <div style=\"font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#bed696;white-space:nowrap\">{{ ownerName }}<\u002Fdiv>\n            <div style=\"flex:1;height:5px;border-radius:999px;background:rgba(244,247,238,.22);overflow:hidden\">\n              <div style=\"{{ clipBarStyle }}\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-family:'Libre Baskerville',Georgia,serif;font-size:18px;color:#f4f7ee;font-variant-numeric:tabular-nums\">{{ litCount }}/9<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"position:absolute;left:16px;right:16px;bottom:26px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px\">\n            <sc-for list=\"{{ playTiles }}\" as=\"t\" hint-placeholder-count=\"9\">\n              <sc-if value=\"{{ t.lit }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"background:#bed696;color:#0e3a24;border-radius:12px;padding:14px 4px;text-align:center;font-size:13px;font-weight:700;animation:wt-pop .26s ease-out;overflow:hidden;text-overflow:ellipsis\">{{ t.word }}<\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ t.known }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"background:rgba(244,247,238,.1);border:1px solid rgba(244,247,238,.22);color:rgba(244,247,238,.5);border-radius:12px;padding:14px 4px;text-align:center;font-size:13px;overflow:hidden;text-overflow:ellipsis\">{{ t.word }}<\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ t.waiting }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"background:rgba(244,247,238,.16);border:1px solid rgba(244,247,238,.3);color:rgba(244,247,238,.6);border-radius:12px;padding:14px 4px;text-align:center;font-size:13px;letter-spacing:.14em\">{{ t.mask }}<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <sc-if value=\"{{ needsTap }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"position:absolute;inset:0;background:rgba(7,30,19,.6);display:flex;align-items:center;justify-content:center\">\n              <button sc-camel-on-click=\"{{ manualPlay }}\" style=\"border:0;cursor:pointer;background:#bed696;color:#0e3a24;border-radius:999px;padding:16px 30px;font-size:15px;font-weight:700;letter-spacing:.06em;text-transform:uppercase\">Tap to play<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ fetching }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px;text-align:center\">\n            <div style=\"width:44px;height:44px;border-radius:999px;border:3px solid rgba(190,214,150,.3);border-top-color:#bed696;animation:wt-spin .8s linear infinite\"><\u002Fdiv>\n            <div style=\"font-family:'Libre Baskerville',Georgia,serif;font-size:20px;color:#f4f7ee\">Unsealing their clip…<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ noClip }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px;text-align:center\">\n            <div style=\"font-family:'Libre Baskerville',Georgia,serif;font-size:22px;color:#f4f7ee\">No clip came through<\u002Fdiv>\n            <p style=\"font-size:12px;color:rgba(244,247,238,.6);margin:0;line-height:1.55\">{{ clipHelp }}<\u002Fp>\n            <label style=\"cursor:pointer;background:#bed696;color:#0e3a24;border-radius:999px;padding:13px 24px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase\">\n              Load their clip\n              <input type=\"file\" accept=\"video/*\" sc-camel-on-change=\"{{ pickClip }}\" style=\"display:none\">\n            <\u002Flabel>\n            <button sc-camel-on-click=\"{{ onClipEnd }}\" style=\"cursor:pointer;background:transparent;color:rgba(244,247,238,.7);border:1px solid rgba(244,247,238,.35);border-radius:999px;padding:12px 22px;font-size:13px\">Skip to the verdict<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isVerdict }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position:absolute;inset:0;display:flex;flex-direction:column;padding:26px;gap:12px;overflow:auto\">\n        <div style=\"margin-top:12px\">\n          <div style=\"font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:#bed696\">{{ verdictKicker }}<\u002Fdiv>\n          <h2 style=\"font-family:'Libre Baskerville',Georgia,serif;font-size:44px;margin:8px 0 6px;line-height:1.02\">{{ revealHeadline }}<\u002Fh2>\n          <p style=\"color:rgba(244,247,238,.78);margin:0;font-size:15px;line-height:1.5\">{{ revealSub }}<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px\">\n          <sc-for list=\"{{ playTiles }}\" as=\"t\" hint-placeholder-count=\"9\">\n            <sc-if value=\"{{ t.said }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"background:#bed696;color:#0e3a24;border-radius:12px;padding:12px 4px;text-align:center;font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis\">{{ t.word }}<\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ t.known }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"background:rgba(244,247,238,.1);border:1px solid rgba(244,247,238,.2);color:rgba(244,247,238,.55);border-radius:12px;padding:12px 4px;text-align:center;font-size:13px;overflow:hidden;text-overflow:ellipsis\">{{ t.word }}<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"margin-top:auto;display:flex;flex-direction:column;gap:8px\">\n          <sc-if value=\"{{ canReplay }}\" hint-placeholder-val=\"{{ true }}\">\n            <button sc-camel-on-click=\"{{ replayClip }}\" style=\"cursor:pointer;background:transparent;color:#f4f7ee;border:1px solid rgba(244,247,238,.4);border-radius:999px;padding:14px;font-size:13px;letter-spacing:.04em\">{{ replayLabel }}<\u002Fbutton>\n          <\u002Fsc-if>\n          <button sc-camel-on-click=\"{{ afterReveal }}\" style=\"border:0;cursor:pointer;background:#bed696;color:#0e3a24;border-radius:999px;padding:16px;font-size:15px;font-weight:700;letter-spacing:.06em;text-transform:uppercase\">{{ afterRevealLabel }}<\u002Fbutton>\n          <p style=\"font-size:11px;color:rgba(244,247,238,.5);margin:0;text-align:center\">{{ clipGoneNote }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isMilestone }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:26px;gap:8px;text-align:center\">\n        <div style=\"position:absolute;top:80px;width:200px;height:200px;border-radius:999px;border:2px solid rgba(190,214,150,.25)\"><\u002Fdiv>\n        <div style=\"position:relative;display:flex;flex-direction:column;align-items:center;gap:10px\">\n          <div style=\"font-family:'Libre Baskerville',Georgia,serif;font-size:54px;line-height:1;color:#bed696;letter-spacing:.02em\">{{ milestoneWord }}<\u002Fdiv>\n          <div style=\"font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:rgba(244,247,238,.6)\">{{ milestoneWho }}<\u002Fdiv>\n          <p style=\"color:#f4f7ee;font-size:15px;margin:14px 0 0;max-width:270px;line-height:1.5\">{{ milestoneLine }}<\u002Fp>\n          <button sc-camel-on-click=\"{{ afterMilestone }}\" style=\"border:0;cursor:pointer;background:#f4f7ee;color:#0e3a24;border-radius:999px;padding:15px 30px;font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-top:26px\">{{ afterMilestoneLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isWin }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:26px;gap:12px;overflow:auto\">\n        <div style=\"position:absolute;left:-54px;bottom:70px;width:170px;height:170px;border-radius:999px;border:2px solid rgba(190,214,150,.28)\"><\u002Fdiv>\n        <div style=\"position:relative\">\n          <div style=\"font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:#bed696\">Match<\u002Fdiv>\n          <h1 style=\"font-family:'Libre Baskerville',Georgia,serif;font-size:46px;line-height:1.02;margin:10px 0 8px\">{{ winnerName }}<br><em style=\"color:#bed696\">wins<\u002Fem><\u002Fh1>\n          <p style=\"color:rgba(244,247,238,.75);font-size:15px;margin:0 0 4px\">{{ finalLine }}<\u002Fp>\n          <p style=\"color:rgba(244,247,238,.55);font-size:13px;margin:0\">{{ finalSets }}<\u002Fp>\n          <div style=\"display:flex;flex-direction:column;gap:8px;margin-top:26px\">\n            <button sc-camel-on-click=\"{{ rematch }}\" style=\"border:0;cursor:pointer;background:#bed696;color:#0e3a24;border-radius:999px;padding:16px;font-size:15px;font-weight:700;letter-spacing:.06em;text-transform:uppercase\">Rematch<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ sendResult }}\" style=\"cursor:pointer;background:transparent;color:#f4f7ee;border:1px solid rgba(244,247,238,.4);border-radius:999px;padding:14px;font-size:13px\">Send the result to {{ opponentName }}<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ goHome }}\" style=\"cursor:pointer;background:transparent;color:rgba(244,247,238,.7);border:0;padding:10px;font-size:13px\">New match<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isHistory }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position:absolute;inset:0;background:#0e3a24;display:flex;flex-direction:column;padding:26px;gap:12px\">\n        <h2 style=\"font-family:'Libre Baskerville',Georgia,serif;font-size:30px;margin:0\">Match log<\u002Fh2>\n        <div style=\"flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px\">\n          <sc-for list=\"{{ history }}\" as=\"h\" hint-placeholder-count=\"3\">\n            <div style=\"background:rgba(244,247,238,.08);border:1px solid rgba(244,247,238,.14);border-radius:14px;padding:12px 16px\">\n              <div style=\"font-family:'Libre Baskerville',Georgia,serif;font-size:15px\">{{ h.title }}<\u002Fdiv>\n              <div style=\"font-size:12px;color:rgba(244,247,238,.65);margin-top:3px\">{{ h.detail }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <sc-if value=\"{{ emptyHistory }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"color:rgba(244,247,238,.6);font-size:14px\">Nothing played yet.<\u002Fp>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ closeHistory }}\" style=\"cursor:pointer;background:transparent;color:#f4f7ee;border:1px solid rgba(244,247,238,.4);border-radius:999px;padding:14px;font-size:13px\">Close<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:430,&quot;height&quot;:900},&quot;roundSeconds&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:30,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:20,&quot;max&quot;:60,&quot;unit&quot;:&quot;s&quot;,&quot;section&quot;:&quot;Default rules&quot;},&quot;pointsPerGame&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:15,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:11,&quot;max&quot;:50,&quot;section&quot;:&quot;Default rules&quot;},&quot;gamesPerSet&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:6,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:2,&quot;max&quot;:8,&quot;section&quot;:&quot;Default rules&quot;},&quot;setsToWin&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:2,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:1,&quot;max&quot;:3,&quot;section&quot;:&quot;Default rules&quot;},&quot;demoControls&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Prototype&quot;}}\">\nclass Component extends DCLogic {\n  pairs = [\n    [\"The Queen\", \"crown corgi throne elizabeth palace jubilee handbag philip reign\",\n     \"Queen\", \"freddie mercury bohemian rhapsody brian guitar champions wembley rock\"],\n    [\"Robbie Williams\", \"angels take that stoke swing entertain tattoo football solo\",\n     \"Kenneth Williams\", \"carry camp voice nostrils comedy sid james diaries innuendo\"],\n    [\"Pigs\", \"farm bacon babe snout mud trotter curly tail oink\",\n     \"Pugs\", \"dog wrinkle snort flat face breathe china lap bulging\"],\n    [\"Pints\", \"beer glass pub lager guinness round foam bitter half\",\n     \"Pants\", \"underwear boxers briefs drawer elastic rubbish wash waist cotton\"],\n    [\"King Kong\", \"ape skyscraper empire state island giant plane roar blonde\",\n     \"Ping Pong\", \"bat table tennis net china ball spin serve basement\"],\n    [\"Rabbits\", \"burrow carrot hop ears warren fluffy breed hutch tail\",\n     \"Habits\", \"nail biting smoking break routine nun bad morning forming\"],\n    [\"Coffee\", \"bean milk espresso cup morning latte caffeine grind cafetiere\",\n     \"Toffee\", \"sticky apple chewy sweet teeth caramel hammer tin everton\"],\n    [\"Surf\", \"wave board wetsuit sea paddle hawaii wipeout tube beach\",\n     \"Turf\", \"grass lawn roll pitch mower groundsman green field accountant\"],\n    [\"Vanilla\", \"pod ice cream flavour plain essence bean custard sponge\",\n     \"Ice\", \"cube skate rink freezer glacier cold melt hockey drink\"],\n    [\"Mustard\", \"yellow hot dijon jar sausage french seed english spread\",\n     \"Custard\", \"yellow cream pudding crumble powder bird tart lumpy jug\"],\n    [\"Elton John\", \"piano glasses candle rocket bernie watford wig tiny dancer\",\n     \"Olivia Newton-John\", \"grease sandy physical australia travolta xanadu leotard sing film\"],\n    [\"Star Wars\", \"jedi lightsaber vader force skywalker yoda empire droid lucas\",\n     \"Star Trek\", \"kirk spock enterprise beam vulcan klingon boldly warp trekkie\"],\n    [\"Museums\", \"exhibit curator dinosaur gallery history artefact tour glass ancient\",\n     \"Mushrooms\", \"fungus forage button garlic spore toadstool cap omelette damp\"],\n    [\"Beards\", \"shave razor trim stubble moustache barber hipster grow itchy\",\n     \"Birds\", \"feather wing nest beak fly egg robin song seed\"],\n    [\"Crayons\", \"wax colour box draw children melt paper blunt scribble\",\n     \"Canyons\", \"grand rock river deep arizona gorge echo cliff mule\"],\n    [\"The Moon\", \"landing armstrong crater orbit tide apollo full night silver\",\n     \"Honeymoon\", \"wedding married holiday couple romance beach suite maldives bride\"],\n    [\"Spiders\", \"web legs eight bath bite silk scary corner hoover\",\n     \"Cider\", \"apple pint somerset scrumpy press dry orchard farm sweet\"],\n    [\"Tarot Cards\", \"deck fortune fool death reading arcana shuffle psychic symbol\",\n     \"Carrot Cake\", \"icing cheese walnut slice sponge spice bake orange coffee\"],\n    [\"Donald Trump\", \"president tower hair election america golf twitter wall apprentice\",\n     \"Donald Duck\", \"disney sailor cartoon quack temper nephews mickey white feathers\"],\n    [\"Crystal Ball\", \"fortune future glass sphere psychic gypsy mist gaze tent\",\n     \"Crystal Palace\", \"football eagles london selhurst park glass exhibition dinosaur fire\"],\n    [\"Hot Dogs\", \"sausage mustard bun ketchup onion stand roll relish contest\",\n     \"Hot Yoga\", \"sweat mat studio pose stretch breathe heat towel downward\"],\n    [\"Greek Gods\", \"zeus olympus thunder poseidon hades athena myth temple hera\",\n     \"Greek Salad\", \"feta olive cucumber tomato oil onion oregano bowl holiday\"],\n    [\"Made In Chelsea\", \"reality posh london drama rich party dating series cast\",\n     \"Chelsea\", \"football blues stamford bridge london abramovich premier league mourinho\"],\n    [\"Salad\", \"lettuce tomato dressing bowl cucumber leaves green caesar onion\",\n     \"Ballad\", \"love song slow power lighter chorus sing radio heartbreak\"],\n    [\"Carpet\", \"floor hoover pile wool stairs fitted stain magic rug\",\n     \"Car Park\", \"space ticket multi storey meter reverse level barrier full\"],\n    [\"Pencils\", \"lead sharpen rubber wood school draw graphite blunt case\",\n     \"Stencils\", \"cut spray letter shape template paint plastic trace sign\"]\n  ].map(function (p) {\n    return [{ name: p[0], words: p[1].split(\" \") }, { name: p[2], words: p[3].split(\" \") }];\n  });\n\n  state = {\n    screen: \"home\", seat: 0, prevScreen: null,\n    nameDraft: \"Player 1\", codeDraft: \"\", guessDraft: \"\",\n    code: \"\", names: [\"Player 1\", \"Player 2\"],\n    points: [0, 0], games: [0, 0], sets: [0, 0], setLog: [],\n    pairIdx: null, side: null, subject: null, tiles: [], options: [],\n    secondsLeft: 30, pending: null, lastRound: null, history: [], winner: null,\n    cameraNote: \"Starting camera…\", listenNote: \"\", clipUrl: null, hasSpeech: true, camReady: false,\n    settingsOpen: false, secsSet: null, targetSet: null, joinError: \"\", copied: false, sent: false,\n    countNumber: 3, clipTime: 0, needsTap: false, watched: 0, pendingResult: null,\n    clipId: null, clipSending: false, clipErr: \"\", hostDraft: \"\", relay: \"\", fetching: false,\n    shareHint: \"The turn and the clip travel together.\"\n  };\n\n  /* ---------- the clip relay ----------\n     The clip is never a file
